<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farmer Dashboard - AgroMart</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .actions {
      margin-top: 0.5rem;
      display: flex;
      gap: 0.5rem;
    }
    .actions button {
      flex: 1;
      padding: 6px 10px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .edit-btn {
      background: #f4c542;
      color: #222;
    }
    .delete-btn {
      background: #e74c3c;
      color: #fff;
    }
  </style>
</head>
<body>
  <header>
    <h1>👨‍🌾 Farmer Dashboard</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="farmer-dashboard.html">My Dashboard</a>
      <a href="login.html">Logout</a>
    </nav>
  </header>

  <main>
    <h2>Add / Update Product</h2>
    <form id="product-form" class="form-container">
      <input type="hidden" id="product-id" />
      <input type="text" id="name" placeholder="Product Name" required />
      <textarea id="description" placeholder="Product Description" required></textarea>
      <input type="number" id="price" placeholder="Price (₦)" required />
      <input type="url" id="image" placeholder="Image URL (paste link)" required />
      <button type="submit">Save Product</button>
      <button type="button" id="cancel-edit" style="display:none;">Cancel Edit</button>
    </form>

    <h2>My Products</h2>
    <div class="product-grid" id="farmer-products">
      <!-- Farmer’s products will show here -->
    </div>
  </main>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, getDocs, query, where, doc, updateDoc, deleteDoc 
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    // ===== Firebase Config =====
    const firebaseConfig = {
      apiKey: "AIzaSyAdoTdXVaYDJCj70NzbI7EHBk-yaPLCrHA",
      authDomain: "agromart-42282.firebaseapp.com",
      projectId: "agromart-42282",
      storageBucket: "agromart-42282.firebasestorage.app",
      messagingSenderId: "474658149379",
      appId: "1:474658149379:web:d37b61e145ffb68130ea36",
      measurementId: "G-7W4M59GG63"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUser = null;

    // ===== Auth Listener =====
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        loadFarmerProducts(user.uid);
      } else {
        window.location.href = "login.html";
      }
    });

    // ===== Add / Update Product =====
    document.getElementById("product-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!currentUser) {
        alert("You must be logged in.");
        return;
      }

      const productId = document.getElementById("product-id").value;
      const name = document.getElementById("name").value;
      const description = document.getElementById("description").value;
      const price = document.getElementById("price").value;
      const image = document.getElementById("image").value;

      try {
        if (productId) {
          // Update product
          const productRef = doc(db, "products", productId);
          await updateDoc(productRef, { name, description, price, image });
          alert("✅ Product updated!");
          document.getElementById("product-id").value = "";
          document.getElementById("cancel-edit").style.display = "none";
        } else {
          // Add new product
          await addDoc(collection(db, "products"), {
            name, description, price, image,
            farmerId: currentUser.uid,
            farmerEmail: currentUser.email,
            createdAt: new Date()
          });
          alert("✅ Product added!");
        }

        document.getElementById("product-form").reset();
        loadFarmerProducts(currentUser.uid);
      } catch (error) {
        console.error(error);
        alert("❌ Failed to save product.");
      }
    });

    // ===== Cancel Edit =====
    document.getElementById("cancel-edit").addEventListener("click", () => {
      document.getElementById("product-id").value = "";
      document.getElementById("product-form").reset();
      document.getElementById("cancel-edit").style.display = "none";
    });

    // ===== Load Farmer Products =====
    async function loadFarmerProducts(farmerId) {
      const farmerProducts = document.getElementById("farmer-products");
      farmerProducts.innerHTML = "<p>Loading...</p>";

      try {
        const q = query(collection(db, "products"), where("farmerId", "==", farmerId));
        const querySnapshot = await getDocs(q);
        farmerProducts.innerHTML = "";

        querySnapshot.forEach((docSnap) => {
          const product = docSnap.data();
          const productCard = `
            <div class="product-card">
              <img src="${product.image || 'https://via.placeholder.com/300'}" alt="${product.name}">
              <div class="product-info">
                <h3>${product.name}</h3>
                <p>${product.description}</p>
                <div class="product-price">₦${product.price}</div>
                <div class="actions">
                  <button class="edit-btn" onclick="editProduct('${docSnap.id}', '${product.name}', '${product.description}', '${product.price}', '${product.image}')">Edit</button>
                  <button class="delete-btn" onclick="deleteProduct('${docSnap.id}')">Delete</button>
                </div>
              </div>
            </div>
          `;
          farmerProducts.innerHTML += productCard;
        });

        if (querySnapshot.empty) {
          farmerProducts.innerHTML = "<p>You haven’t added any products yet.</p>";
        }
      } catch (error) {
        console.error(error);
        farmerProducts.innerHTML = "<p>Failed to load products.</p>";
      }
    }

    // ===== Edit Product =====
    window.editProduct = (id, name, description, price, image) => {
      document.getElementById("product-id").value = id;
      document.getElementById("name").value = name;
      document.getElementById("description").value = description;
      document.getElementById("price").value = price;
      document.getElementById("image").value = image;
      document.getElementById("cancel-edit").style.display = "inline-block";
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    // ===== Delete Product =====
    window.deleteProduct = async (id) => {
      if (!confirm("Are you sure you want to delete this product?")) return;
      try {
        await deleteDoc(doc(db, "products", id));
        alert("🗑️ Product deleted!");
        loadFarmerProducts(currentUser.uid);
      } catch (error) {
        console.error(error);
        alert("❌ Failed to delete product.");
      }
    };
  </script>
</body>
</html>
