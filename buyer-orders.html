<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders - AgroMart</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .order-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .order-card h3 {
      margin-bottom: 0.5rem;
      color: #2d6a4f;
    }
    .order-items {
      margin: 0.5rem 0;
      padding-left: 1.2rem;
    }
    .order-status {
      margin-top: 0.5rem;
      font-weight: bold;
    }
    .status-pending { color: #ff9800; }
    .status-processing { color: #3498db; }
    .status-completed { color: #27ae60; }
  </style>
</head>
<body>
  <header>
    <h1>🛒 My Orders</h1>
    <nav>
      <a href="buyer-dashboard.html">Shop</a>
      <a href="buyer-orders.html">My Orders</a>
      <a href="index.html">Logout</a>
    </nav>
  </header>

  <main>
    <h2>Your Order History</h2>
    <div id="orders-list"></div>
  </main>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import { 
      getFirestore, collection, query, where, onSnapshot 
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    // ===== Firebase Config =====
    const firebaseConfig = {
      apiKey: "AIzaSyAdoTdXVaYDJCj70NzbI7EHBk-yaPLCrHA",
      authDomain: "agromart-42282.firebaseapp.com",
      projectId: "agromart-42282",
      storageBucket: "agromart-42282.firebasestorage.app",
      messagingSenderId: "474658149379",
      appId: "1:474658149379:web:d37b61e145ffb68130ea36",
      measurementId: "G-7W4M59GG63"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // ===== Auth Listener =====
    onAuthStateChanged(auth, (user) => {
      if (user) {
        subscribeToOrders(user.uid);
      } else {
        window.location.href = "login.html";
      }
    });

    // ===== Real-Time Orders Listener =====
    function subscribeToOrders(buyerId) {
      const ordersList = document.getElementById("orders-list");
      ordersList.innerHTML = "<p>Loading your orders...</p>";

      const q = query(collection(db, "orders"), where("buyerId", "==", buyerId));

      onSnapshot(q, (snapshot) => {
        ordersList.innerHTML = "";

        if (snapshot.empty) {
          ordersList.innerHTML = "<p>You have no orders yet.</p>";
          return;
        }

        snapshot.forEach((docSnap) => {
          const order = docSnap.data();

          const orderDiv = document.createElement("div");
          orderDiv.classList.add("order-card");

          orderDiv.innerHTML = `
            <h3>Order ID: ${docSnap.id}</h3>
            <p><strong>Total:</strong> ₦${order.total}</p>
            <ul class="order-items">
              ${order.items.map(item => `<li>${item.name} - ₦${item.price}</li>`).join("")}
            </ul>
            <div class="order-status">
              Status: <span class="status-${(order.status || 'pending').toLowerCase()}">${order.status || "Pending"}</span>
            </div>
          `;

          ordersList.appendChild(orderDiv);
        });
      });
    }
  </script>
</body>
</html>
