```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farmer Registration - AgroMart</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>👨‍🌾 Register as a Farmer</h1>
    <nav><a href="index.html">Home</a></nav>
  </header>

  <main class="form-container">
    <form id="register-form">
      <input type="text" id="fullname" placeholder="Full Name" required />
      <input type="email" id="email" placeholder="Email Address" required />
      <input type="password" id="password" placeholder="Create Password" required />
      <label>Upload Farm Logo / Profile Picture</label>
      <input type="file" id="profilePic" accept="image/*" required />
      <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="login.html">Login here</a></p>
  </main>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-analytics.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";

    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyAdoTdXVaYDJCj70NzbI7EHBk-yaPLCrHA",
      authDomain: "agromart-42282.firebaseapp.com",
      projectId: "agromart-42282",
      storageBucket: "agromart-42282.firebasestorage.app",
      messagingSenderId: "474658149379",
      appId: "1:474658149379:web:d37b61e145ffb68130ea36",
      measurementId: "G-7W4M59GG63"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const fullname = document.getElementById("fullname").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const file = document.getElementById("profilePic").files[0];

      try {
        // Create user in Firebase Auth
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // Upload profile picture
        const storageRef = ref(storage, `farmers/${user.uid}/profile_${Date.now()}`);
        await uploadBytes(storageRef, file);
        const profilePicUrl = await getDownloadURL(storageRef);

        // Save farmer profile in Firestore
        await setDoc(doc(db, "farmers", user.uid), {
          fullname,
          email,
          profilePicUrl,
          createdAt: new Date()
        });

        alert("✅ Registration successful!");
        window.location.href = "dashboard.html";
      } catch (err) {
        alert("❌ " + err.message);
      }
    });
  </script>
</body>
</html>
